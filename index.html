<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Dashboard</title>
<meta name="description" content="Kalender, Mails, Finanz-Briefing, Noten, Budget, Training und Gewicht an einem Ort.">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09110F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Cockpit. Phone = one column + Tab-Leiste unten; Desktop = feste Seitenleiste + zweispaltiges Raster.
   Zahlen in schmaler Archivo (Anzeigetafel), Akzent KIT-Grün, Safran nur für "diese Woche". */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #F5F8F6;
  --line: #DAE2DE;
  --ink: #0E1916;
  --ink-2: #46564F;
  --ink-3: #75857F;
  --accent: #00806A;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EDE6;
  --signal: #D98E0B;
  --signal-soft: #FAEBCB;
  --good: #16824A;
  --good-soft: #DAF1E3;
  --warn: #A86F00;
  --warn-soft: #F8EBCF;
  --bad: #C23A3A;
  --bad-soft: #F7DEDC;
  --grid: #E3E9E6;
  --brief-bg: #12302A;
  --brief-fg: #EAF3EF;
  --brief-line: #12302A;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r: 16px;
  --r-sm: 10px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09110F; --surface: #101A17; --surface-2: #15211E; --line: #213029;
    --ink: #E6EFEB; --ink-2: #A7B7B0; --ink-3: #72837C;
    --accent: #2BC4A3; --accent-ink: #03201A; --accent-soft: #11362E;
    --signal: #F0B23F; --signal-soft: #382A0E;
    --good: #43C47E; --good-soft: #10301F; --warn: #E8AE42; --warn-soft: #33270C; --bad: #F06B6B; --bad-soft: #3A1717;
    --grid: #1C2925;
    --brief-bg: #12302A; --brief-fg: #E6EFEB; --brief-line: #1E4A40;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09110F; --surface: #101A17; --surface-2: #15211E; --line: #213029;
  --ink: #E6EFEB; --ink-2: #A7B7B0; --ink-3: #72837C;
  --accent: #2BC4A3; --accent-ink: #03201A; --accent-soft: #11362E;
  --signal: #F0B23F; --signal-soft: #382A0E;
  --good: #43C47E; --good-soft: #10301F; --warn: #E8AE42; --warn-soft: #33270C; --bad: #F06B6B; --bad-soft: #3A1717;
  --grid: #1C2925;
    --brief-bg: #12302A; --brief-fg: #E6EFEB; --brief-line: #1E4A40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-display); font-variation-settings: "wdth" 78; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tab { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-3); }
.soft { color: var(--ink-2); }
.small { font-size: 13px; }

/* Shell */
.app { min-height: 100%; }
.rail { display: none; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 1200px; margin: 0 auto; }
.view { display: flex; flex-direction: column; gap: 16px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); cursor: pointer; border-radius: 12px; }
.tabbar button svg, .rail button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.2; }
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 24px 14px 20px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
  .rail .brand { padding: 0 10px 22px; }
  .rail button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; border-radius: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-align: left; }
  .rail button:hover { background: var(--surface-2); }
  .rail button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
  .rail button[aria-current="page"] svg { color: var(--accent); }
  .rail .rail-foot { margin-top: auto; padding: 12px 10px 0; font-size: 12px; color: var(--ink-3); }
  .main { padding-block: 28px 48px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}
.brand-mark { font-family: var(--f-display); font-variation-settings: "wdth" 125; font-weight: 900; font-size: 19px; letter-spacing: -0.02em; line-height: 1; }
.brand-mark span { color: var(--accent); }

/* Page head */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.head h1 { margin: 2px 0 0; font-family: var(--f-display); font-variation-settings: "wdth" 118; font-weight: 850; font-size: clamp(26px, 6.4vw, 40px); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
.head .sub { margin-top: 6px; color: var(--ink-2); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Cards & grids */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-family: var(--f-display); font-variation-settings: "wdth" 108; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.card-h .eyebrow { margin-bottom: 2px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.grid3 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .span2 { grid-column: span 2; } }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi:hover { border-color: var(--ink-3); }
.kpi .v { font-size: 34px; line-height: 1.05; margin-top: 4px; }
.kpi .v small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .d { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: clamp(44px, 12vw, 64px); line-height: .95; }

/* Week strip */
.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-width: 0; }
.wday .dn { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; font-weight: 600; }
.wday .dd { font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 750; font-size: 21px; line-height: 1.1; }
.wday .dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.wday .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
.wday .dots i.t { background: var(--signal); }
.wday .dots i.h { background: var(--bad); }
.wday.past { opacity: .62; }
.wday.today { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.wday.today .dn { color: var(--bg); opacity: .8; }
.wday.sel:not(.today) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* Buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-danger { color: var(--bad); }
.btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink-3); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.chip.signal { background: var(--signal-soft); color: var(--ink); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.ex { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-3); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Lists */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowlink { text-decoration: none; color: inherit; cursor: pointer; }
.rowlink:hover .t { text-decoration: underline; text-decoration-color: var(--ink-3); }
.daylabel { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 12px 0 2px; }
.daylabel:first-child { padding-top: 0; }
.time { font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; width: 46px; flex: none; }
.time small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--ink-3); }
.ev-bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); flex: none; }
.now-ev { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; border-top: 0; margin: 4px 0; }
.unread .t::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-2); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty b { color: var(--ink); }
.note { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.note.bad { background: var(--bad-soft); color: var(--ink); }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; padding: 12px 14px; border: 1px dashed var(--ink-3); border-radius: 14px; font-size: 14px; color: var(--ink-2); }

/* Stats */
.statline { display: flex; flex-wrap: wrap; gap: 18px 26px; }
.stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat .v { font-size: 28px; line-height: 1.05; }
.stat .v small { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-left: 2px; }
.progress { height: 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.progress > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; }
.progress > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.stack { display: flex; height: 22px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--surface); }
.stack > i { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-direction: column; gap: 0; }
.legend .row { padding: 8px 0; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.ring-dots { display: flex; gap: 5px; }
.ring-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--signal); display: block; }
.ring-dots i.on { background: var(--signal); }

/* Brief */
.brief { background: var(--brief-bg); color: var(--brief-fg); border-color: var(--brief-line); }
.brief .eyebrow, .brief .muted { color: color-mix(in srgb, var(--brief-fg) 62%, transparent); }
.brief .soft { color: color-mix(in srgb, var(--brief-fg) 82%, transparent); }
.brief .seg { background: color-mix(in srgb, var(--brief-fg) 10%, transparent); border-color: transparent; }
.brief .seg button { color: color-mix(in srgb, var(--brief-fg) 75%, transparent); }
.brief .seg button[aria-pressed="true"] { background: var(--brief-fg); color: var(--brief-bg); }
.brief .row { border-color: color-mix(in srgb, var(--brief-fg) 16%, transparent); }
.brief .btn { background: transparent; color: var(--brief-fg); border-color: color-mix(in srgb, var(--brief-fg) 30%, transparent); }
.brief .btn-primary { background: var(--signal); color: #1B1405; border-color: var(--signal); }
.brief .field textarea, .brief textarea.input { background: color-mix(in srgb, var(--brief-fg) 8%, transparent); border-color: color-mix(in srgb, var(--brief-fg) 22%, transparent); color: var(--brief-fg); }
.brief .field textarea:focus { outline-color: var(--signal); }
.brief .field > span { color: color-mix(in srgb, var(--brief-fg) 70%, transparent); }
.brief .chip { background: color-mix(in srgb, var(--brief-fg) 12%, transparent); color: var(--brief-fg); border-color: transparent; }
.brief .chip.signal { background: var(--signal); color: #1B1405; }
.brief-title { font-family: var(--f-display); font-variation-settings: "wdth" 120; font-weight: 850; font-size: clamp(22px, 5vw, 30px); line-height: 1.05; letter-spacing: -0.02em; margin: 4px 0 14px; text-wrap: balance; }
.brief-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .brief-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.brief .stat .v small { color: color-mix(in srgb, var(--brief-fg) 70%, transparent); }
.ai-text { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; }
.daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daygrid > div { border-radius: 9px; padding: 7px 6px; background: color-mix(in srgb, var(--brief-fg) 7%, transparent); min-width: 0; font-size: 12px; }
.daygrid .n { font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 750; font-size: 18px; }

/* Kalender: Ansichten */
.cal-ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav .icon-btn { border: 1px solid var(--line); font-size: 20px; line-height: 1; color: var(--ink); }
.wk { display: flex; flex-direction: column; gap: 6px; }
.wk-day { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.wk-day:first-child { border-top: 0; }
.wk-day.past { opacity: .6; }
.wk-h { background: none; border: 0; padding: 2px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--ink); border-radius: 10px; align-self: start; }
.wk-h span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.wk-h b { font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 750; font-size: 20px; line-height: 1.1; }
.wk-day.today .wk-h { background: var(--ink); color: var(--bg); }
.wk-day.today .wk-h span { color: var(--bg); opacity: .8; }
.wk-evs { display: flex; flex-direction: column; gap: 4px; min-width: 0; justify-content: center; }
.wk-ev { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--c); text-decoration: none; color: var(--ink); font-size: 13.5px; min-width: 0; }
.wk-t { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12px; flex: none; }
.wk-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
@media (min-width: 1100px) {
  .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .wk-day { grid-template-columns: 1fr; border-top: 0; padding: 0; gap: 6px; align-content: start; }
  .wk-h { flex-direction: row; gap: 6px; justify-content: center; padding: 6px 0; background: var(--surface-2); }
  .wk-ev { flex-direction: column; gap: 1px; }
  .wk-n { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
}
.mo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.mo-hd { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; text-align: center; padding-bottom: 4px; }
